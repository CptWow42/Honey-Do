<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-honey-pot"></i>
                <h1>Honey-Do List</h1>
            </div>
            <p class="subtitle">Sweeten your productivity</p>
        </header>

        <div class="app-container">
            <div class="input-section">
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="100">
                    <div class="priority-selector">
                        <button class="priority-btn active" data-priority="low">Low</button>
                        <button class="priority-btn" data-priority="medium">Medium</button>
                        <button class="priority-btn" data-priority="high">High</button>
                    </div>
                    <button id="addTaskBtn" class="add-btn">
                        <i class="fas fa-plus"></i> Add Task
                    </button>
                </div>
            </div>

            <div class="progress-section">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="progress-text" id="progressText">0% Complete</span>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <div class="tasks-section">
                <div class="tasks-header">
                    <h2><i class="fas fa-tasks"></i> Your Tasks</h2>
                    <span class="task-count" id="taskCount">0 tasks</span>
                </div>
                
                <div class="task-list" id="taskList">
                    <!-- Tasks will be added here dynamically -->
                    <div class="empty-state" id="emptyState">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>No tasks yet</h3>
                        <p>Add your first task to get started!</p>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>Made with <i class="fas fa-heart"></i> by Honey-Do</p>
            <button id="clearAllBtn" class="clear-btn">
                <i class="fas fa-trash-alt"></i> Clear All
            </button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
