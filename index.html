<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Honey-Do</h1>
        
        <div class="input-area">
            <input type="text" id="task-input" placeholder="Honey Please...">
            <button id="add-task-button">Please</button>
        </div>

        <ul id="task-list">
            <!-- To-do items will be dynamically added here by JavaScript -->
        </ul>

        <button id="clear-all-button">Honey Done</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
